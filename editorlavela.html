<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - Cevichería y Mariscos La Vela</title>
    <link rel="icon" type="image/jpeg" href="Logo_la vela.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/analytics": "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
        }
    }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#d32f2f',
                            dark: '#b71c1c',
                            light: '#fdfbf7',
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #d32f2f; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .input-edit {
            border: none;
            border-bottom: 2px solid #e5e7eb;
            border-radius: 0;
            padding: 8px 0;
            background: transparent;
            transition: border-color 0.3s;
            width: 100%;
        }
        .input-edit:focus {
            outline: none;
            border-bottom-color: #d32f2f;
        }
        .input-price {
            text-align: right;
            min-width: 100px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d32f2f; }
    </style>
</head>
<body class="antialiased text-brand-red">

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { getDatabase, ref, onValue, set } from "firebase/database";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyAcGuroj-IbeWvZo5xIbCpIaNspCv9aTNo",
            authDomain: "menu-7af06.firebaseapp.com",
            databaseURL: "https://menu-7af06-default-rtdb.firebaseio.com",
            projectId: "menu-7af06",
            storageBucket: "menu-7af06.firebasestorage.app",
            messagingSenderId: "415299307211",
            appId: "1:415299307211:web:6967e5683cb42fb3bffd4e",
            measurementId: "G-DV0M7SJ3KL"
        };

        const app = initializeApp(firebaseConfig);
        try { getAnalytics(app); } catch (e) { console.warn('Analytics no disponible', e); }
        const db = getDatabase(app);
        const menuRef = ref(db, 'menuData');
        const auth = getAuth(app);
        window.firebaseMenuRef = menuRef;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('editor-content').classList.remove('hidden');
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
                document.getElementById('editor-content').classList.add('hidden');
            }
        });

        window.loginUser = async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.innerText = '';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.innerText = 'Correo o contraseña incorrectos.';
                console.error(error);
            }
        };

        window.saveMenuToFirebase = async function(data) {
            if (!auth.currentUser) {
                document.getElementById('login-modal').classList.remove('hidden');
                document.getElementById('editor-content').classList.add('hidden');
                return false;
            }
            try {
                await set(menuRef, data);
                return true;
            } catch (error) {
                console.error(error);
                return false;
            }
        };

        onValue(menuRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.sections) {
                window.menuData = data;
            }
            renderEditor();
        });
    </script>

    <script>
        const defaultMenuData = {
            sections: [
                {
                    id: "entradas",
                    title: "ENTRADAS",
                    icon: "🍽️",
                    items: [
                        { id: 1, name: "CÓCTEL DE CAMARÓN", desc: "Camarón fresco en salsa roja, aguacate, galletas saladas y limón.", price: 18000 },
                        { id: 2, name: "EMPANADAS DE MARISCOS", desc: "Crocantes empanadas rellenas de mariscos, acompañadas de salsa tártara.", price: 15000 },
                        { id: 3, name: "CHICHARRÓN DE CALAMAR", desc: "Aros de calamar apanados, servidos con salsa de la casa.", price: 22000 }
                    ]
                },
                {
                    id: "platos",
                    title: "PLATOS PRINCIPALES",
                    icon: "🦐",
                    items: [
                        { id: 4, name: "CEVICHE DE CAMARÓN", desc: "Limón, cebolla morada, cilantro y salsa de la casa.", price: 28000 },
                        { id: 5, name: "MOJARRA FRITA", desc: "Acompañada de patacón, arroz con coco y ensalada.", price: 35000 },
                        { id: 6, name: "CAZUELA DE MARISCOS", desc: "Pulpo, calamar, camarón y mejillones. Incluye arroz.", price: 42000 },
                        { id: 7, name: "ARROZ A LA MARINERA", desc: "Salteado al wok con mixtura de mariscos y vegetales.", price: 32000 },
                        { id: 8, name: "LANGOSTINOS AL AJILLO", desc: "Bañados en salsa de ajo y mantequilla, con puré.", price: 55000 },
                        { id: 9, name: "CÓCTEL DE PULPO", desc: "Salsa roja, aguacate, galletas saladas y limón.", price: 26000 }
                    ]
                },
                {
                    id: "bebidas",
                    title: "BEBIDAS",
                    icon: "🍹",
                    items: [
                        { id: 10, name: "LIMONADA DE COCO", desc: "Refrescante limonada con leche de coco.", price: 8000 },
                        { id: 11, name: "CERVEZA NACIONAL", desc: "Cerveza nacional bien fría.", price: 6000 },
                        { id: 12, name: "JUGO NATURAL", desc: "Jugo natural en agua o leche.", price: 7000 },
                        { id: 13, name: "GASEOSA PERSONAL", desc: "Gaseosa personal de 400 ml.", price: 5000 }
                    ]
                }
            ]
        };

        window.menuData = defaultMenuData;

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        function formatCOP(value) {
            const number = parseInt(String(value).replace(/[^0-9]/g, ''), 10);
            if (isNaN(number)) return '';
            return '$ ' + number.toLocaleString('es-CO');
        }

        function formatPrice(input) {
            input.value = formatCOP(input.value);
        }

        function getDataFromEditor() {
            const data = { sections: [] };
            const sectionEls = document.querySelectorAll('.editor-section');
            sectionEls.forEach(sectionEl => {
                const sectionId = sectionEl.dataset.sectionId;
                const title = sectionEl.querySelector('.section-title-input').value.trim();
                const icon = sectionEl.querySelector('.section-icon-input').value.trim();
                const items = [];
                const itemEls = sectionEl.querySelectorAll('.editor-item');
                itemEls.forEach(itemEl => {
                    const id = parseInt(itemEl.dataset.itemId) || generateId();
                    const name = itemEl.querySelector('.item-name-input').value.trim();
                    const desc = itemEl.querySelector('.item-desc-input').value.trim();
                    const price = parseInt(itemEl.querySelector('.item-price-input').value.replace(/[^0-9]/g, '')) || 0;
                    if (name) {
                        items.push({ id, name, desc, price });
                    }
                });
                data.sections.push({ id: sectionId, title: title || 'SECCIÓN', icon, items });
            });
            return data;
        }

        async function saveMenu() {
            const data = getDataFromEditor();
            const success = await window.saveMenuToFirebase(data);
            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            if (success) {
                btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Guardado`;
                btn.classList.remove('bg-brand-red');
                btn.classList.add('bg-green-600');
            } else {
                btn.innerHTML = `<i data-lucide="x" class="w-4 h-4"></i> Error`;
                btn.classList.remove('bg-brand-red');
                btn.classList.add('bg-red-800');
            }
            lucide.createIcons();
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-600', 'bg-red-800');
                btn.classList.add('bg-brand-red');
                lucide.createIcons();
            }, 2000);
        }

        function addItem(sectionId) {
            const sectionEl = document.querySelector(`.editor-section[data-section-id="${sectionId}"]`);
            const itemsContainer = sectionEl.querySelector('.editor-items');
            const itemEl = document.createElement('div');
            itemEl.className = "editor-item grid grid-cols-1 md:grid-cols-12 gap-4 pb-4 border-b border-brand-red/10";
            itemEl.dataset.itemId = generateId();
            itemEl.innerHTML = `
                <div class="md:col-span-3">
                    <input type="text" class="item-name-input input-edit font-serif font-bold text-brand-red" placeholder="Nombre del plato" required>
                </div>
                <div class="md:col-span-6">
                    <input type="text" class="item-desc-input input-edit font-serif text-sm text-brand-red/80" placeholder="Descripción">
                </div>
                <div class="md:col-span-2">
                    <input type="text" inputmode="numeric" class="item-price-input input-edit input-price font-serif font-bold text-brand-red" placeholder="Precio" oninput="formatPrice(this)" required>
                </div>
                <div class="md:col-span-1 flex justify-end items-center">
                    <button onclick="this.closest('.editor-item').remove()" class="text-brand-red/50 hover:text-brand-red transition-colors p-1" title="Eliminar plato">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            itemsContainer.appendChild(itemEl);
            lucide.createIcons();
        }

        function addSection() {
            const container = document.getElementById('menu-container');
            const sectionId = 'section_' + generateId();
            const sectionEl = document.createElement('div');
            sectionEl.className = "editor-section mb-10 p-4 border border-brand-red/10 rounded-lg bg-white/50";
            sectionEl.dataset.sectionId = sectionId;
            sectionEl.innerHTML = `
                <div class="flex items-center justify-between mb-4 gap-4">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <input type="text" class="section-icon-input input-edit w-14 text-center font-serif text-3xl" value="🍽️" title="Icono de la sección (emoji)">
                        <input type="text" class="section-title-input input-edit flex-1 font-sans text-xs tracking-[0.3em] uppercase text-brand-red font-bold" value="NUEVA SECCIÓN">
                    </div>
                    <button onclick="removeSection('${sectionId}')" class="text-brand-red/50 hover:text-brand-red transition-colors flex-shrink-0 p-1" title="Eliminar sección">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="editor-items space-y-4"></div>
                <button onclick="addItem('${sectionId}')" class="mt-4 text-xs font-sans uppercase tracking-widest text-brand-red border border-brand-red/30 px-4 py-2 hover:bg-brand-red hover:text-white transition-colors">
                    + Agregar plato
                </button>
            `;
            container.appendChild(sectionEl);
            lucide.createIcons();
        }

        function removeSection(sectionId) {
            if (!confirm('¿Eliminar esta sección y todos sus platos?')) return;
            const sectionEl = document.querySelector(`.editor-section[data-section-id="${sectionId}"]`);
            sectionEl.remove();
        }

        function renderEditor() {
            const container = document.getElementById('menu-container');
            const data = window.menuData || defaultMenuData;
            container.innerHTML = '';

            data.sections.forEach(section => {
                const sectionEl = document.createElement('div');
                sectionEl.className = "editor-section mb-10 p-4 border border-brand-red/10 rounded-lg bg-white/50";
                sectionEl.dataset.sectionId = section.id;
                sectionEl.innerHTML = `
                    <div class="flex items-center justify-between mb-4 gap-4">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <input type="text" class="section-icon-input input-edit w-14 text-center font-serif text-3xl" value="${section.icon || ''}" title="Icono de la sección (emoji)" placeholder="🍽️">
                            <input type="text" class="section-title-input input-edit flex-1 font-sans text-xs tracking-[0.3em] uppercase text-brand-red font-bold" value="${section.title}">
                        </div>
                        <button onclick="removeSection('${section.id}')" class="text-brand-red/50 hover:text-brand-red transition-colors flex-shrink-0 p-1" title="Eliminar sección">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="editor-items space-y-4">
                        ${(section.items || []).map(item => `
                            <div class="editor-item grid grid-cols-1 md:grid-cols-12 gap-4 pb-4 border-b border-brand-red/10" data-item-id="${item.id}">
                                <div class="md:col-span-3">
                                    <input type="text" class="item-name-input input-edit font-serif font-bold text-brand-red" value="${item.name}" placeholder="Nombre del plato" required>
                                </div>
                                <div class="md:col-span-6">
                                    <input type="text" class="item-desc-input input-edit font-serif text-sm text-brand-red/80" value="${item.desc}" placeholder="Descripción">
                                </div>
                                <div class="md:col-span-2">
                                    <input type="text" inputmode="numeric" class="item-price-input input-edit input-price font-serif font-bold text-brand-red" value="${formatCOP(item.price)}" placeholder="Precio" oninput="formatPrice(this)" required>
                                </div>
                                <div class="md:col-span-1 flex justify-end items-center">
                                    <button onclick="this.closest('.editor-item').remove()" class="text-brand-red/50 hover:text-brand-red transition-colors p-1" title="Eliminar plato">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="addItem('${section.id}')" class="mt-4 text-xs font-sans uppercase tracking-widest text-brand-red border border-brand-red/30 px-4 py-2 hover:bg-brand-red hover:text-white transition-colors">
                        + Agregar plato
                    </button>
                `;
                container.appendChild(sectionEl);
            });

            lucide.createIcons();
        }
    </script>

    <div id="login-modal" class="fixed inset-0 bg-brand-dark/95 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-brand-light w-full max-w-sm p-8 border-4 border-double border-brand-red relative text-center">
            <img src="Logo_la vela.jpg" alt="Logo La Vela" class="h-20 w-20 object-contain rounded-full border-2 border-brand-red/20 shadow-sm mx-auto mb-6">
            <h2 class="font-serif text-2xl font-bold mb-2">Acceso al editor</h2>
            <p class="font-sans text-xs tracking-widest uppercase text-brand-red/60 mb-6">Ingresa tus credenciales para continuar</p>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-sans tracking-widest uppercase text-brand-red/60 mb-1">Correo</label>
                    <input type="email" id="login-email" class="input-edit w-full font-serif text-brand-red" placeholder="admin@lavela.com">
                </div>
                <div>
                    <label class="block text-xs font-sans tracking-widest uppercase text-brand-red/60 mb-1">Contraseña</label>
                    <input type="password" id="login-password" class="input-edit w-full font-serif text-brand-red" placeholder="••••••••">
                </div>
                <p id="login-error" class="text-red-600 text-sm font-sans text-center min-h-[20px]"></p>
                <button onclick="loginUser()" class="w-full bg-brand-red text-white font-sans uppercase tracking-widest text-xs font-bold py-4 hover:bg-brand-dark transition-colors">
                    Ingresar
                </button>
            </div>
        </div>
    </div>

    <div id="editor-content" class="hidden">
        <nav class="fixed top-0 w-full bg-brand-light/95 backdrop-blur-sm border-b border-brand-red/20 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <img src="Logo_la vela.jpg" alt="Logo La Vela" class="h-10 w-10 object-contain rounded-full border border-brand-red/20">
                <div class="font-serif font-bold text-xl tracking-widest">EDITOR LA VELA</div>
            </div>
            <div class="flex items-center gap-3">
                <a href="lavela.html" target="_blank" class="hidden md:flex items-center gap-2 text-sm font-sans uppercase tracking-widest text-brand-red hover:underline">
                    <i data-lucide="external-link" class="w-4 h-4"></i> Ver menú
                </a>
                <button id="btn-save" onclick="saveMenu()" class="bg-brand-red text-white font-sans uppercase tracking-widest text-xs font-bold px-6 py-3 hover:bg-brand-dark transition-colors flex items-center gap-2 shadow-md">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Guardar
                </button>
            </div>
        </nav>

        <main class="max-w-3xl mx-auto bg-brand-light min-h-screen mt-16 shadow-2xl border-x border-brand-red/10 relative pb-28">
            <div class="pt-12 pb-8 text-center px-4">
                <div class="flex justify-center mb-4">
                    <img src="Logo_la vela.jpg" alt="Logo La Vela" class="h-20 w-20 object-contain rounded-full border-2 border-brand-red/20 shadow-sm">
                </div>
                <h1 class="font-serif text-6xl md:text-8xl font-black tracking-tighter mb-2">EDITOR</h1>
                <h2 class="font-sans text-sm md:text-base tracking-[0.3em] uppercase border-y-2 border-brand-red inline-block py-1 px-8 font-bold">
                    Cevichería y Mariscos La Vela
                </h2>
                <p class="mt-4 text-xs font-sans uppercase tracking-widest text-brand-red/60">Modifica el menú y pulsa Guardar para actualizar en tiempo real</p>
            </div>

            <div class="px-6 md:px-16 py-8" id="menu-container"></div>

            <div class="px-6 md:px-16 pb-8">
                <button onclick="addSection()" class="w-full border-2 border-dashed border-brand-red/30 text-brand-red/70 font-sans uppercase tracking-widest text-xs font-bold py-4 hover:border-brand-red hover:text-brand-red transition-colors">
                    + Agregar nueva sección
                </button>
            </div>

            <div class="text-center pb-12 opacity-50">
                <p class="font-serif italic text-sm">~ Gracias por su preferencia ~</p>
            </div>
        </main>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
